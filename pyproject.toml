[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explorative-live-plotting"
version = "0.1.0"
description = "Local, lazy, extensible plotting workbench powered by Polars and Matplotlib"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "flask>=3.0",
  "matplotlib>=3.8",
  "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
explorative-live-plotting = "explorative_live_plotting.cli:main"
elp = "explorative_live_plotting.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/explorative_live_plotting"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

